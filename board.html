<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 주문 전광판</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--ink:#2b1d12;--accent:#ff6b2c;--red:#e8261b;--ok:#1f9d55;--cream:#fff8ef}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;color:var(--ink);background:#1d140d;overflow:hidden}
  .app{display:grid;grid-template-columns:44% 56%;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;background:#2b1d12;color:#fff}
  header h1{margin:0;font-size:clamp(18px,2.2vw,30px)}
  header .r{display:flex;gap:14px;align-items:center;font-size:clamp(14px,1.4vw,20px)}
  .clock{font-variant-numeric:tabular-nums;font-weight:800}
  .salechip{background:var(--red);padding:6px 12px;border-radius:99px;font-weight:900;animation:pulse 1s infinite alternate}
  @keyframes pulse{to{opacity:.65}}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;background:#4a3524;color:#fff;font-size:14px}

  /* 왼쪽: 캐릭터 무대 */
  .stage{position:relative;overflow:hidden;background:linear-gradient(#bfe3ff 0%,#e6f4ff 45%,#fde6f0 62%,#cfeeb0 63%,#8fd16a 100%)}
  .hill{position:absolute;bottom:0;left:-10%;width:120%;height:42%;background:radial-gradient(ellipse at 30% 0%,#a9df7f 0 40%,transparent 41%),radial-gradient(ellipse at 80% 10%,#9ad46f 0 38%,transparent 39%);opacity:.9}
  .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9;animation:drift 40s linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud.c1{width:140px;height:40px;top:9%;left:-20%}.cloud.c1::before{width:60px;height:60px;top:-28px;left:22px}.cloud.c1::after{width:46px;height:46px;top:-18px;left:72px}
  .cloud.c2{width:110px;height:32px;top:20%;left:-30%;animation-duration:55s;animation-delay:-20s}.cloud.c2::before{width:46px;height:46px;top:-22px;left:18px}.cloud.c2::after{width:36px;height:36px;top:-14px;left:58px}
  @keyframes drift{to{transform:translateX(160vw)}}
  .mascot{position:absolute;left:50%;bottom:9%;width:min(52%,340px);transform:translateX(-50%)}
  .bubble{position:absolute;left:50%;bottom:calc(9% + min(46vw*.52,300px));transform:translateX(-50%);background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px 20px;font-size:clamp(18px,2.1vw,32px);font-weight:900;text-align:center;min-width:60%;max-width:92%;box-shadow:0 8px 0 rgba(0,0,0,.12);transition:transform .2s}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);border:14px solid transparent;border-top-color:var(--ink)}
  .bubble small{display:block;font-size:.55em;font-weight:700;color:#8a7765;margin-top:4px}
  .bubble.pop{animation:pop .5s}
  @keyframes pop{0%{transform:translateX(-50%) scale(.6)}70%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
  .name-tag{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(43,29,18,.85);color:#fff;border-radius:99px;padding:4px 14px;font-weight:800;font-size:14px}
  .qrbox{position:absolute;right:14px;top:14px;background:#fff;border-radius:14px;padding:10px;text-align:center;font-weight:900;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .qrbox #qr img,.qrbox #qr canvas{width:110px!important;height:110px!important}
  .stats{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px}
  .stat{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 14px;min-width:150px;box-shadow:0 6px 18px rgba(0,0,0,.1)}
  .stat small{display:block;font-size:12px;color:#8a7765;font-weight:700}
  .stat b{font-size:clamp(18px,2vw,28px)}

  /* 오른쪽: 주문 현황 */
  .side{display:grid;grid-template-rows:1fr auto;background:var(--cream);min-height:0}
  .cols{display:grid;grid-template-columns:1.25fr 1fr;min-height:0}
  .col{padding:18px;overflow:hidden;min-height:0}
  .col h2{margin:0 0 12px;font-size:clamp(18px,1.9vw,28px)}
  .col.ready{background:#fff1e8;border-left:3px dashed #ffd0b5}
  .card{background:#fff;border:2px solid #f0e1cf;border-radius:16px;padding:12px 14px;margin-bottom:10px;animation:slidein .5s}
  .card.new{border-color:var(--accent);box-shadow:0 0 0 4px #ffe1d1}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}}
  .card .top{display:flex;justify-content:space-between;align-items:baseline}
  .no{font-size:clamp(26px,2.8vw,42px);font-weight:900;color:var(--accent)}
  .nm{font-size:clamp(16px,1.6vw,22px);font-weight:800;margin-left:6px}
  .items{font-size:clamp(14px,1.4vw,19px);margin-top:2px}
  .eta{font-weight:900;font-size:clamp(14px,1.4vw,19px);color:#b26b00}
  .eta.late{color:var(--red)}
  .st{font-size:12px;font-weight:800;border-radius:99px;padding:3px 8px;background:#f3ebe2;color:#6b5440}
  .readyno{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:10px 16px;margin-bottom:10px;border:3px solid var(--ok);animation:slidein .5s}
  .readyno .no{color:var(--ok);font-size:clamp(34px,3.6vw,56px)}
  .readyno .nm{font-size:clamp(18px,1.8vw,26px)}
  .empty{color:#8a7765;font-weight:700;padding:20px 0;text-align:center}
  .rank{display:flex;gap:10px;padding:12px 18px;background:#2b1d12;color:#fff;align-items:center;font-size:clamp(13px,1.3vw,18px)}
  .rank .bar{flex:1;display:flex;gap:10px}
  .rank .it{flex:1;background:#4a3524;border-radius:10px;padding:6px 10px;position:relative;overflow:hidden}
  .rank .it i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55;transition:width .6s}
  .rank .it span{position:relative;font-weight:800}

  .start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(29,20,13,.92);color:#fff;text-align:center;flex-direction:column;gap:16px}
  .start button{font-size:28px;font-weight:900;padding:20px 40px;border-radius:20px;border:0;background:var(--accent);color:#fff;cursor:pointer}
  .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:40;animation:fall 2.2s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="start" id="start">
  <div style="width:180px" id="startMascot"></div>
  <div style="font-size:22px;font-weight:800">주문 들어오면 소리 + 음성으로 알려줘요</div>
  <button id="startBtn">▶ 전광판 시작</button>
  <div style="opacity:.7;font-size:14px">노트북 소리를 켜두세요 · 전체화면은 F11</div>
</div>

<div class="app">
  <header>
    <h1>🍜 전남대 광주캠퍼스 창업동아리 <span style="color:#ffb22c">미르</span> · 실시간 주문</h1>
    <div class="r">
      <span class="salechip" id="salechip" style="display:none"></span>
      <span class="clock" id="clock"></span>
      <a class="btn" id="adminBadge" href="/admin.html" target="_blank" style="text-decoration:none">🔒 관리자 로그인 시 실명</a>
      <button class="btn" id="voiceBtn">🔊 음성 ON</button>
      <button class="btn" id="fsBtn">⛶ 전체화면</button>
    </div>
  </header>

  <section class="stage">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="hill"></div>
    <div class="stats">
      <div class="stat"><small>오늘 주문</small><b id="sCount">0건</b></div>
      <div class="stat"><small>오늘 매출</small><b id="sSales">0원</b></div>
      <div class="stat"><small>⭐ 평균 별점</small><b id="sStar">-</b></div>
    </div>
    <div class="qrbox"><div id="qr"></div>📱 여기서 주문!<div id="acctB" style="margin-top:6px;font-size:12px;font-weight:800;color:#6b5440"></div></div>
    <div class="bubble" id="bubble">어서 오세요! 🍜<small>QR 찍고 주문하면 제가 불러드려요</small></div>
    <div class="mascot" id="mascot"></div>
    <div class="name-tag">미르 마스코트 뿌링이</div>
  </section>

  <section class="side">
    <div class="cols">
      <div class="col">
        <h2>🔥 조리 중 <span id="cTodo" style="color:var(--accent)"></span></h2>
        <div id="todo"></div>
      </div>
      <div class="col ready">
        <h2>🍜 나왔어요! 찾아가세요</h2>
        <div id="ready"></div>
      </div>
    </div>
    <div class="rank"><b>🏆 인기 메뉴</b><div class="bar" id="rank"></div></div>
  </section>
</div>

<script type="module">
import * as CFG from './config.js';
import { configured, watchOrders, watchReviews, itemsOf, onAdmin } from './db.js';
import { mascotSVG, MASCOT_CSS } from './mascot.js';
const { MENU } = CFG;
const fmtAcct = a => a.length === 14 ? `${a.slice(0,6)}-${a.slice(6,8)}-${a.slice(8)}` : a;
const SALE = CFG.SALE || null;
const READY_MINUTES = CFG.READY_MINUTES || 5;

const $ = id => document.getElementById(id);
const won = n => n.toLocaleString('ko-KR') + '원';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 전광판은 공개 화면이라 이름 가운데 가리기: 김철수 → 김*수
const mask = n => { n = String(n); return n.length <= 1 ? n : n.length === 2 ? n[0] + '*' : n[0] + '*'.repeat(n.length - 2) + n[n.length - 1]; };
// 관리자 로그인 상태면 실명 표시
let isAdmin = false;
const nameOf = n => isAdmin ? String(n) : mask(n);
const waitOf = o => Math.max(1, ...MENU.filter(m => (o.qty?.[m.key]||0) > 0).map(m => m.wait || READY_MINUTES));
const etaOf = o => o.createdAt.getTime() + waitOf(o) * 60000;

// 캐릭터
const st = document.createElement('style'); st.textContent = MASCOT_CSS; document.head.appendChild(st);
$('mascot').innerHTML = mascotSVG('b'); $('startMascot').innerHTML = mascotSVG('s');
try { new QRCode($('qr'), { text: location.origin + '/', width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); } catch { $('qr').textContent = location.host; }

// 시계 + 세일 표시
const hm = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
function kstNow(){ const k = new Date(Date.now() + 9*3600e3); return k; }
function tick(){
  const k = kstNow();
  $('clock').textContent = `${String(k.getUTCHours()).padStart(2,'0')}:${String(k.getUTCMinutes()).padStart(2,'0')}:${String(k.getUTCSeconds()).padStart(2,'0')}`;
  if (SALE) { const x = k.getUTCHours()*60 + k.getUTCMinutes(); const on = x >= hm(SALE.start) && x < hm(SALE.end);
    $('salechip').style.display = on ? 'inline-block' : 'none'; if (on) $('salechip').textContent = `⏰ 타임세일 ~${SALE.end}`; }
  renderTodoEta();
}
setInterval(tick, 1000);

// 소리 + 음성
let actx = null, voiceOn = true;
function unlock(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch{} }
function chime(notes){ try{ unlock(); notes.forEach(([f,t]) => { const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.5,actx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+t+0.45);
  o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.5); }); }catch{} }
const NEW_SOUND = [[784,0],[988,0.15],[1175,0.3],[1568,0.45]];
const READY_SOUND = [[1319,0],[1047,0.35],[1319,0.8],[1047,1.15]];
let koVoice = null;
function pickVoice(){ const vs = speechSynthesis.getVoices(); koVoice = vs.find(v => v.lang === 'ko-KR') || vs.find(v => v.lang?.startsWith('ko')) || null; }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch {}
function say(text){ if(!voiceOn) return; try{ const u = new SpeechSynthesisUtterance(text); u.lang='ko-KR'; if(koVoice) u.voice=koVoice; u.rate=1.02; u.pitch=1.25; speechSynthesis.speak(u); }catch{} }
$('voiceBtn').onclick = () => { voiceOn = !voiceOn; $('voiceBtn').textContent = voiceOn ? '🔊 음성 ON' : '🔇 음성 OFF'; };
$('fsBtn').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch{} };

// 말풍선 + 점프 + 꽃가루
let bubbleTimer = null;
function announce(main, sub){
  const b = $('bubble'); b.innerHTML = `${main}<small>${sub||''}</small>`;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  const m = $('mascot'); m.classList.remove('mascot-jump'); void m.offsetWidth; m.classList.add('mascot-jump');
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => { b.innerHTML = '어서 오세요! 🍜<small>QR 찍고 주문하면 제가 불러드려요</small>'; m.classList.remove('mascot-jump'); }, 12000);
}
function confetti(){ const colors=['#ff6b2c','#ffb22c','#1f9d55','#3182f6','#e8261b'];
  for(let i=0;i<40;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.background=colors[i%5];
    c.style.animationDelay=(Math.random()*.6)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),3200); } }

// 데이터
let orders = [], seen = null, prevStatus = {};
const itemText = o => itemsOf(o).map(i => `${i.name.replace(/ \(.*\)/,'')} ${i.qty}`).join(', ');
function onOrders(list){
  orders = list;
  if (seen) {
    const fresh = list.filter(o => !seen.has(o.id)).sort((a,b) => a.no - b.no);
    fresh.forEach((o, i) => setTimeout(() => {
      chime(NEW_SOUND); confetti();
      announce(`🎉 ${o.no}번 주문 들어왔습니다!`, `${esc(itemText(o))} · 약 ${waitOf(o)}분`);
      say(`${o.no}번 주문 들어왔습니다. ${itemText(o).replace(/,/g,' ')}`);
    }, i * 3500));
    list.forEach(o => {
      if (prevStatus[o.id] && prevStatus[o.id] !== '조리완료' && prevStatus[o.id] !== '수령완료' && o.status === '조리완료') {
        chime(READY_SOUND);
        announce(`🍜 ${o.no}번 주문 나왔습니다!`, `${o.no}번 손님, 부스로 와주세요`);
        say(`${o.no}번 주문 나왔습니다. ${o.no}번 손님, 부스로 와주세요.`);
      }
    });
  }
  seen = new Set(list.map(o => o.id));
  list.forEach(o => prevStatus[o.id] = o.status);
  render();
}

function render(){
  const todo = orders.filter(o => o.status !== '조리완료' && o.status !== '수령완료').sort((a,b) => a.no - b.no);
  const ready = orders.filter(o => o.status === '조리완료').sort((a,b) => a.no - b.no).slice(0, 6);
  $('cTodo').textContent = todo.length ? `${todo.length}건` : '';
  const newest = orders.length ? Math.max(...orders.map(o=>o.no)) : -1;
  $('todo').innerHTML = todo.length ? todo.slice(0, 7).map(o => `
    <div class="card ${o.no===newest && Date.now()-o.createdAt.getTime()<60000?'new':''}">
      <div class="top"><div><span class="no">#${o.no}</span><span class="nm">${esc(nameOf(o.name))}</span></div>
      <span class="st">${o.status==='조리중'?'👨‍🍳 조리 중':o.status==='송금완료'?'송금확인중':o.status==='입금확인'?'💰 결제완료':o.pay==='현장결제'?'💵 현장결제':'결제 대기'}</span></div>
      <div class="items">${esc(itemText(o))}</div>
      <div class="eta" data-eta="${etaOf(o)}"></div>
    </div>`).join('') + (todo.length > 7 ? `<div class="empty">외 ${todo.length-7}건 더 있어요</div>` : '')
    : '<div class="empty">지금 조리 중인 주문이 없어요 😴</div>';
  $('ready').innerHTML = ready.length ? ready.map(o => `
    <div class="readyno"><span class="no">#${o.no}</span><span class="nm">${esc(nameOf(o.name))}</span></div>`).join('')
    : '<div class="empty">곧 나와요!</div>';
  // 통계
  $('sCount').textContent = orders.length + '건';
  $('sSales').textContent = won(orders.reduce((a,o) => a + o.total, 0));
  const cnt = {}; MENU.forEach(m => cnt[m.key] = 0); orders.forEach(o => MENU.forEach(m => cnt[m.key] += (o.qty?.[m.key]||0)));
  const max = Math.max(1, ...Object.values(cnt));
  $('rank').innerHTML = [...MENU].sort((a,b) => cnt[b.key]-cnt[a.key]).map((m,i) => `
    <div class="it"><i style="width:${cnt[m.key]/max*100}%"></i><span>${['🥇','🥈','🥉'][i]||''} ${m.emoji} ${esc(m.name.replace(/ \(.*\)/,''))} ${cnt[m.key]}개</span></div>`).join('');
  renderTodoEta();
}
function renderTodoEta(){
  const now = Date.now();
  document.querySelectorAll('[data-eta]').forEach(el => {
    const left = Number(el.dataset.eta) - now;
    if (left > 0) { const m = Math.floor(left/60000), s = Math.floor(left/1000)%60; el.textContent = `⏱ ${m}:${String(s).padStart(2,'0')} 남음`; el.classList.remove('late'); }
    else { el.textContent = '🔔 곧 나와요!'; el.classList.add('late'); }
  });
}

$('startBtn').onclick = () => {
  unlock(); chime(NEW_SOUND); say('전광판을 시작할게요!');
  $('start').style.display = 'none';
  try{ document.documentElement.requestFullscreen(); }catch{}
};
if (!configured) $('todo').innerHTML = '<div class="empty">config.js에 Firebase 설정이 필요해요</div>';
else {
  let unsub = null;
  onAdmin(ok => {
    if (ok && !unsub) unsub = watchOrders(onOrders, e => { console.error(e); $('todo').innerHTML = '<div class="empty">주문을 불러오지 못했어요</div>'; });
    if (!ok) { if (unsub) { unsub(); unsub = null; } $('todo').innerHTML = '<div class="empty">🔒 이 노트북에서 <a href="/admin.html" target="_blank">관리자 로그인</a>을 하면 주문이 표시돼요</div>'; }
  });
  watchReviews(list => { $('sStar').textContent = list.length ? `★ ${(list.reduce((a,r)=>a+r.stars,0)/list.length).toFixed(1)}` : '-'; });
}
if (configured) onAdmin(ok => { isAdmin = ok; const bd = $('adminBadge');
  bd.textContent = ok ? '🔓 관리자 모드 · 실명 표시' : '🔒 관리자 로그인 시 실명'; bd.style.background = ok ? '#1f9d55' : '#4a3524'; render(); });
document.getElementById('acctB').innerHTML = `💳 ${CFG.BANK}<br>${fmtAcct(CFG.ACCOUNT)}`;
tick();
</script>
</body>
</html>
